<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>フォーサイド株価モニター</title>
    <style>
        /* 画面全体のデザイン設定 */
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        /* 株価を表示するカードのデザイン */
        .stock-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 300px;
            text-align: center;
        }
        .stock-code {
            font-size: 14px;
            color: #888;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .stock-name {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }
        .stock-price-box {
            font-size: 40px;
            font-weight: bold;
            color: #d9534f; /* 株価を目立たせる赤色 */
            margin-bottom: 10px;
        }
        .currency {
            font-size: 20px;
            margin-left: 5px;
            color: #333;
        }
        .update-time {
            font-size: 11px;
            color: #aaa;
        }
    </style>
</head>
<body>
  <!-- 株価カードが並ぶコンテナ -->
  <div id="stock-board"></div>

  <script>
    // ==========================================
    // 【重要】新しくデプロイし直した 
    // GASの「ウェブアプリURL」をここに貼り付けてください！
    // ==========================================
    const gasWebAppUrl = "https://script.google.com/macros/s/AKfycbzA2dw2WI56sv9WBBMNvIJ1x6iqfqs3mH4N7V6aVKJSuxVi2elApoeI0av6qWQoVJ57/exec";

    // 表示したい銘柄・為替の全リスト（ここでお好きな順番に入れ替えて大丈夫です）
    const items = [
        { code: "2330", name: "フォーサイド", market: "東証スタンダード", unit: "円" },
        { code: "2370", name: "メディネット", market: "東証グロース", unit: "円" },
        { code: "6656", name: "インスペック", market: "東証スタンダード", unit: "円" },
        { code: "8086", name: "ニプロ", market: "東証プライム", unit: "円" },
        { code: "USD",  name: "米ドル / 円", market: "為替（1ドル）", unit: "円" },
        { code: "CNY100", name: "100円の人民元", market: "為替（100円あたり）", unit: "元" }
    ];

    // 1. 画面にすべてのカードを初期配置する関数
    function initBoard() {
        const board = document.getElementById("stock-board");
        board.innerHTML = "";
        
        items.forEach(item => {
            const card = document.createElement("div");
            card.className = "stock-card";
            
            let marketText = (item.code === "USD" || item.code === "CNY100") 
                ? item.market 
                : item.market + ": " + item.code;

            card.innerHTML = `
                <div class="stock-code">${marketText}</div>
                <div class="stock-name">${item.name}</div>
                <div class="stock-price-box">
                    <span id="price-${item.code}">-</span><span class="currency">${item.unit}</span>
                </div>
                <div class="update-time" id="time-${item.code}">データを読み込み中...</div>
            `;
            board.appendChild(card);
        });
    }

    // 2. 単発で1つの銘柄データをGASから取得して画面に即反映する関数
    async function fetchSingleItem(item) {
        try {
            // URL結合時のバグを防ぐため、安全なURLオブジェクトを生成
            const urlObj = new URL(gasWebAppUrl);
            urlObj.searchParams.set("code", item.code);

            const response = await fetch(urlObj.toString());
            const data = await response.json();
            
            const priceEl = document.getElementById("price-" + item.code);
            const timeEl = document.getElementById("time-" + item.code);

            if (!priceEl || !timeEl) return;

            if (data.error) {
                timeEl.innerText = "エラー: " + data.error;
                return;
            }

            let displayPrice = data.price;
            if (item.code === "USD") {
                displayPrice = Number(data.price).toFixed(2);
            } else if (item.code === "CNY100") {
                displayPrice = Number(data.price).toFixed(4);
            } else {
                displayPrice = Number(data.price);
            }

            priceEl.innerText = displayPrice;
            const now = new Date();
            timeEl.innerText = "最終更新: " + now.toLocaleTimeString();

        } catch (error) {
            console.error(item.name + "の取得に失敗:", error);
            const timeEl = document.getElementById("time-" + item.code);
            if (timeEl) {
                timeEl.innerText = "データ取得に失敗しました";
            }
        }
    }

    // 3. 全銘柄を一斉に（同時に）取得開始する関数
    function getAllStockPrices() {
        // ループ（for文）で待たせるのをやめ、すべての銘柄の通信を一瞬で同時に走らせます
        items.forEach(item => {
            fetchSingleItem(item);
        });
    }

    // 実行
    initBoard();
    getAllStockPrices();
  </script>
</body>
  
  </html>
